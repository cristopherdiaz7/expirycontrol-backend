# Perfil de producción: se activa con SPRING_PROFILES_ACTIVE=prod.
# No crea ni altera tablas, no registra SQL y exige DB_URL y CORS_ALLOWED_ORIGINS.
spring:
  datasource:
    url: ${DB_URL}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  error:
    include-message: never
    include-stacktrace: never
  # Las peticiones las registra RequestLoggingFilter, con su identificador y en todos los perfiles.
  # El registro de accesos de Tomcat queda apagado para no anotar dos veces cada petición.

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
