# Perfil de producción: se activa con SPRING_PROFILES_ACTIVE=prod.
# No crea ni altera tablas, no registra SQL y exige DB_URL y CORS_ALLOWED_ORIGINS.
spring:
  datasource:
    url: ${DB_URL}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  error:
    include-message: never
    include-stacktrace: never
  # Registro de accesos por salida estándar, junto al resto de los logs.
  # Solo método, ruta (sin parámetros), código de respuesta y duración: nunca cabeceras ni cuerpos.
  tomcat:
    accesslog:
      enabled: true
      directory: /dev
      prefix: stdout
      suffix: ""
      file-date-format: ""
      buffered: false
      pattern: 'ACCESO %m %U %s %{ms}Tms'

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
