# Perfil de desarrollo (activo por defecto).
spring:
  # Una base local creada antes de las migraciones se registra como "ya en la versión 1":
  # Flyway no ejecuta nada sobre ella y no toca sus datos.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
