spring:
  application:
    name: expiry-control
  profiles:
    default: dev
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5433/expiry_control?options=-c%20TimeZone%3DUTC}"
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Pool de conexiones chico: una base pequeña admite pocas conexiones simultáneas.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 20000
  # El esquema lo crean las migraciones de Flyway (db/migration); Hibernate solo lo verifica.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# Actuator: solo se publica el endpoint de salud, sin detalles internos.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006,http://127.0.0.1:19006}"
