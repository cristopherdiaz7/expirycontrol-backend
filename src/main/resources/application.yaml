spring:
  application:
    name: expiry-control
  profiles:
    default: dev
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5433/expiry_control?options=-c%20TimeZone%3DUTC}"
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006,http://127.0.0.1:19006}"
