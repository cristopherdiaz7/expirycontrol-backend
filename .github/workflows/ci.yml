name: CI

# Integración continua: tests, jar e imagen Docker en cada cambio.
# En master, además, la imagen probada se publica en el registro de Azure.
# Este workflow nunca despliega: de eso se encarga cd.yml, cuando el CI termina bien.
on:
  push:
    branches: [master]
    # Un cambio que solo toca documentación no genera una imagen nueva ni despliega.
    paths-ignore:
      - "**.md"
  # En un Pull Request corre siempre, aunque solo cambie documentación:
  # así se ve que el CI prueba y construye sin desplegar.
  pull_request:
    branches: [master]
  workflow_dispatch:

# Por defecto el workflow solo puede leer el código. Cada job pide lo que le falte.
permissions:
  contents: read

# Si llega un cambio nuevo a la misma rama, se cancela la ejecución anterior.
# En master no se cancela: una publicación no se interrumpe por la mitad.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Registro donde se publica la imagen. No son secretos: solo identifican el destino.
env:
  ACR_NAME: expirycontrolacr
  IMAGE_NAME: expirycontrol-backend

jobs:
  test:
    name: Tests y jar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # En Windows Git no guarda el permiso de ejecución del wrapper.
      - name: Dar permiso de ejecución a mvnw
        run: chmod +x mvnw

      # Los tests usan H2 en memoria: no necesitan base de datos ni secretos.
      - name: Ejecutar los tests
        run: ./mvnw -B test

      - name: Generar el jar
        run: ./mvnw -B package -DskipTests

      - name: Comprobar que existe target/app.jar
        run: |
          test -f target/app.jar
          ls -lh target/app.jar

      - name: Guardar el reporte de tests si fallaron
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-de-tests
          path: target/surefire-reports/
          retention-days: 7

  # Los tests corren sobre H2. Las pruebas de concurrencia se repiten acá contra un
  # PostgreSQL real, con el esquema de Flyway: el bloqueo de filas y las restricciones
  # son los mismos que en producción.
  postgres:
    name: Concurrencia en PostgreSQL
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dar permiso de ejecución a mvnw
        run: chmod +x mvnw

      # Misma descarga resistente al límite de los registros públicos que en el job de la imagen.
      - name: Levantar PostgreSQL
        run: |
          set -euo pipefail
          for ronda in 1 2 3; do
            for origen in public.ecr.aws/docker/library mirror.gcr.io/library docker.io/library; do
              if docker pull --quiet "$origen/postgres:16" > /dev/null; then
                docker tag "$origen/postgres:16" postgres:16
                break 2
              fi
            done
            if [ "$ronda" -lt 3 ]; then sleep 20; fi
          done

          DB_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$DB_PASSWORD"
          echo "TEST_DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name db -p 5432:5432 \
            -e POSTGRES_DB=expiry_test \
            -e POSTGRES_USER=expiry_test \
            -e POSTGRES_PASSWORD="$DB_PASSWORD" \
            postgres:16

          for i in $(seq 1 30); do
            if docker exec db pg_isready -h 127.0.0.1 -U expiry_test -d expiry_test > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "PostgreSQL no arrancó"
          exit 1

      - name: Pruebas de concurrencia contra PostgreSQL
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/expiry_test
          TEST_DB_USER: expiry_test
          TEST_DB_DRIVER: org.postgresql.Driver
          TEST_DB_FLYWAY: "true"
          TEST_DB_DDL_AUTO: validate
        run: ./mvnw -B test -Dtest='LossConcurrencyIntegrationTest,LossApiIntegrationTest#simultaneousRequestsRecordTheLossOnlyOnce'

  docker:
    name: Imagen Docker
    # Solo si los tests pasaron: no se construye una imagen con tests rotos.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Necesario para publicar el informe de Grype en la pestaña Security.
      security-events: write
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # Los registros públicos limitan las descargas anónimas y a veces rechazan a
      # los servidores de GitHub (error 429). Las dos imágenes que necesita el job
      # se piden a tres orígenes, en orden y con reintentos, y se dejan con su
      # nombre original: son las mismas imágenes y el Dockerfile no se toca.
      - name: Descargar las imágenes de Maven y PostgreSQL
        run: |
          traer() {
            for ronda in 1 2 3; do
              for origen in public.ecr.aws/docker/library mirror.gcr.io/library docker.io/library; do
                if docker pull --quiet "$origen/$1" > /dev/null; then
                  docker tag "$origen/$1" "$1"
                  echo "$1 descargada desde $origen"
                  return 0
                fi
              done
              echo "Ningún origen entregó $1 (ronda $ronda)"
              if [ "$ronda" -lt 3 ]; then sleep 20; fi
            done
            return 1
          }

          # La imagen de Maven es la que pide el Dockerfile de la cátedra.
          traer "$(awk 'toupper($1) == "FROM" && $2 ~ /^maven:/ { print $2; exit }' Dockerfile)"
          traer postgres:16

      - name: Construir la imagen con el Dockerfile de la cátedra
        run: |
          for intento in 1 2 3; do
            if docker build -t expiry-control:ci .; then exit 0; fi
            echo "Falló el intento $intento"
            if [ "$intento" -lt 3 ]; then sleep 30; fi
          done
          exit 1

      # Arranca la imagen con el perfil prod contra un PostgreSQL vacío,
      # igual que en producción. Las credenciales se generan al azar en cada
      # ejecución y no se guardan en ningún lado.
      - name: Prueba de arranque
        run: |
          set -euo pipefail
          DB_PASSWORD="$(openssl rand -hex 16)"
          JWT_SECRET="$(openssl rand -hex 48)"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$JWT_SECRET"

          docker network create ci
          docker run -d --name db --network ci \
            -e POSTGRES_DB=expiry_control \
            -e POSTGRES_USER=expiry_user \
            -e POSTGRES_PASSWORD="$DB_PASSWORD" \
            postgres:16

          echo "Esperando a PostgreSQL..."
          for i in $(seq 1 30); do
            if docker exec db pg_isready -h 127.0.0.1 -U expiry_user -d expiry_control > /dev/null 2>&1; then break; fi
            sleep 2
          done

          docker run -d --name app --network ci -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_OUTPUT_ANSI_ENABLED=NEVER \
            -e DB_URL=jdbc:postgresql://db:5432/expiry_control \
            -e POSTGRES_USER=expiry_user \
            -e POSTGRES_PASSWORD="$DB_PASSWORD" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e CORS_ALLOWED_ORIGINS=http://localhost:8081 \
            -e APPLICATIONINSIGHTS_CONNECTION_STRING="InstrumentationKey=00000000-0000-0000-0000-000000000000;IngestionEndpoint=http://127.0.0.1:9/" \
            expiry-control:ci

          echo "Esperando a la aplicación..."
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/actuator/health 2> /dev/null | grep -q '"status":"UP"'; then
              echo "La aplicación responde: salud UP"
              exit 0
            fi
            sleep 2
          done

          echo "La aplicación no respondió a tiempo"
          exit 1

      # La prueba de arranque le pasa al agente una dirección falsa (un puerto local cerrado):
      # así arranca y mide la aplicación como en Azure, pero no envía nada a ningún lado.
      - name: Comprobar el agente de Application Insights
        run: |
          linea="$(docker logs app 2>&1 | grep -m1 "Application Insights Java Agent" || true)"
          echo "$linea"
          if ! echo "$linea" | grep -q "started successfully"; then
            echo "El agente de Application Insights no arrancó"
            exit 1
          fi

      # Grype revisa la imagen ya construida: sistema base, JVM y librerías empaquetadas.
      # Solo informa (fail-build: false): la imagen base la define el Dockerfile de la cátedra.
      - name: Analizar la imagen con Grype
        id: grype
        uses: anchore/scan-action@v7
        with:
          image: expiry-control:ci
          fail-build: false
          output-format: sarif

      - name: Publicar el informe de Grype
        if: always() && steps.grype.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-imagen

      - name: Resumir el informe de Grype
        if: always() && steps.grype.outputs.sarif != ''
        run: |
          total="$(jq '[.runs[].results[]] | length' "${{ steps.grype.outputs.sarif }}")"
          {
            echo "### Grype: vulnerabilidades conocidas en la imagen"
            echo ""
            echo "Hallazgos: **$total**. El detalle está en la pestaña Security del repositorio."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Grype informó $total hallazgos"

      - name: Comprobar que los endpoints siguen protegidos
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/products)"
          echo "GET /products sin token: $status"
          test "$status" = "401"

      # Desechabilidad: al recibir la orden de apagado, la aplicación termina los pedidos en
      # curso y cierra sus conexiones antes de que Docker tenga que forzar el cierre.
      - name: Prueba de cierre controlado
        run: |
          set -euo pipefail
          inicio=$(date +%s)
          docker stop --time 60 app > /dev/null
          segundos=$(( $(date +%s) - inicio ))
          codigo="$(docker inspect app --format '{{.State.ExitCode}}')"
          logs="$(docker logs app 2>&1)"
          echo "La aplicación se detuvo en ${segundos} s (código de salida $codigo)"

          for mensaje in "Commencing graceful shutdown" "Graceful shutdown complete" "HikariPool-1 - Shutdown completed"; do
            if ! echo "$logs" | grep -qF "$mensaje"; then
              echo "Falta en el log: $mensaje"
              exit 1
            fi
            echo "En el log: $mensaje"
          done
          # 137 significa que Docker tuvo que matar el proceso: el cierre no fue ordenado.
          if [ "$codigo" = "137" ]; then
            echo "Docker tuvo que forzar el cierre"
            exit 1
          fi
          {
            echo "### Cierre controlado"
            echo ""
            echo "La aplicación se detuvo en ${segundos} s, terminando los pedidos en curso y cerrando las conexiones a la base."
          } >> "$GITHUB_STEP_SUMMARY"

      # La imagen que se publica es esta misma, la que pasó la prueba de arranque:
      # se construye una sola vez y no se vuelve a compilar para desplegar.
      - name: Exportar la imagen probada
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: docker save expiry-control:ci | gzip > imagen.tar.gz

      - name: Guardar la imagen para el job de publicación
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: imagen
          path: imagen.tar.gz
          retention-days: 1

      - name: Mostrar los logs de la aplicación
        if: always()
        run: docker logs app 2>&1 | tail -n 60 || true

  # Publicar no es desplegar: la imagen queda en el registro, lista para que cd.yml la use.
  # En un Pull Request no se publica nada; solo se construye y se prueba.
  publish:
    name: Publicar imagen
    # Solo en master y solo si la imagen y las pruebas en PostgreSQL pasaron.
    needs: [docker, postgres]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Permite pedir a GitHub el token OIDC con el que se inicia sesión en Azure.
      id-token: write
    steps:
      - name: Recuperar la imagen probada
        uses: actions/download-artifact@v8
        with:
          name: imagen

      # La etiqueta sale del commit: cada imagen se puede rastrear hasta su código.
      - name: Calcular la etiqueta
        id: tag
        run: |
          commit="${GITHUB_SHA::7}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$commit" >> "$GITHUB_OUTPUT"

      # Inicio de sesión sin contraseña (OIDC). Los tres valores son identificadores.
      - name: Iniciar sesión en Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Iniciar sesión en el registro
        run: az acr login --name "$ACR_NAME"

      - name: Subir la imagen al registro
        run: |
          set -euo pipefail
          repo="$ACR_NAME.azurecr.io/$IMAGE_NAME"
          gunzip -c imagen.tar.gz | docker load
          docker tag expiry-control:ci "$repo:${{ steps.tag.outputs.tag }}"
          docker tag expiry-control:ci "$repo:latest"
          docker push "$repo:${{ steps.tag.outputs.tag }}"
          docker push "$repo:latest"
          {
            echo "### Imagen publicada"
            echo ""
            echo "\`$repo:${{ steps.tag.outputs.tag }}\`"
            echo ""
            echo "El despliegue lo hace el workflow CD, por separado."
          } >> "$GITHUB_STEP_SUMMARY"
